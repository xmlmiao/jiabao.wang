<style>

/* 图片类画作：img=点开后显示的大图，thumb=墙上的小缩略图（w×h 像素） */
const ART_SIZE=20;

const C=document.getElementById('c'),X=C.getContext('2d'),W=192,H=128;

function galleryLayout(){
 const feat=GALLERY.filter(g=>g.featured),rest=GALLERY.filter(g=>!g.featured);
 const half=Math.ceil(rest.length/2),order=[...rest.slice(0,half),...feat,...rest.slice(half)];
 const dims=order.map(g=>({g,w:ART_SIZE+4,h:ART_SIZE+4}));
 const L=52,R=152,total=dims.reduce((a,d)=>a+d.w,0),gap=Math.max(1,Math.floor((R-L-total)/Math.max(1,dims.length-1)));
 let x=L+Math.floor((R-L-total-gap*(dims.length-1))/2);const base=32;
 return dims.map(d=>{const o={...d,x,y:base-d.h};x+=d.w+gap;return o});
}
function drawRoom(f){
 const ph=phase();
 // 墙
 r(0,0,W,90,'#6b4f8a');for(let x=0;x<W;x+=8)r(x,0,1,90,'#634780');

 // 地板

 // 窗户（天空内容裁剪在玻璃内，不会画到墙上）
 const sky={day:'#8fd3ff',dusk:'#ff9e6b',night:'#1a1f4a'}[ph];
 const wx=12,wy=16,ww=32,wh=26;
 r(10,14,36,30,'#3a2a20');r(wx,wy,ww,wh,sky);
 X.save();X.beginPath();X.rect(wx,wy,ww,wh);X.clip();
 if(ph==='night'){r(34,20,4,4,'#fff6c2');r(35,21,3,3,sky);[[16,20],[24,30],[40,34],[20,36],[28,22]].forEach(([a,b],i)=>{if((f>>4)+i&1)r(a,b,1,1,'#fff')})}
 else{r(ph==='day'?36:16,ph==='day'?20:32,5,5,ph==='day'?'#fff3a0':'#ffe08a');
  // 云从左飘到右；?cloud=edge 强制贴右缘，方便截图验收
  const force=query.get('cloud');
  const cx=force==='edge'?wx+ww-6:wx+((f>>3)%(ww+16))-8;
  r(cx,24,8,2,'#fff');r(cx+2,23,4,1,'#fff')}
 X.restore();
 r(27,wy,2,wh,'#3a2a20');r(wx,28,ww,2,'#3a2a20');r(8,43,40,3,'#5a3e2b');
 // 窗台植物
 r(36,38,6,5,'#c0603a');r(37,34,1,4,'#4caf50');r(39,32,1,6,'#2e7d32');r(40,35,2,1,'#4caf50');r(35,36,2,1,'#4caf50');
 // 画廊
 galleryLayout().forEach(({g,x,y,w,h})=>{r(x,y,w,h,'#3a2a20');r(x+1,y+1,w-2,h-2,g.featured?'#f2c94c':'#d9a441');
   if(g.timg){if(g.timg.naturalWidth){if(g.crop)X.drawImage(g.timg,...g.crop,x+2,y+2,ART_SIZE,ART_SIZE);else X.drawImage(g.timg,x+2,y+2,ART_SIZE,ART_SIZE)}return}
   if(g.preview)X.drawImage(g.preview,x+2,y+2,ART_SIZE,ART_SIZE)});
 // 书架
 r(156,34,30,56,'#5a3e2b');r(158,36,26,52,'#3a2a20');
 const bc=['#e45b5b','#5bb0e4','#f2c94c','#6fcf97','#bb6bd9','#f2994a'];
 [36,53,70].forEach((y,s)=>{r(158,y+15,26,2,'#5a3e2b');for(let i=0;i<7;i++){const hh=10+((i*7+s*3)%5);r(159+i*3+(i>4?2:0),y+15-hh,3,hh,bc[(i+s)%6]);r(159+i*3+(i>4?2:0),y+15-hh+2,3,1,'rgba(255,255,255,.35)')}});
 // 地毯
 r(64,108,72,14,'#2f6f8f');r(66,110,68,10,'#3f8fb0');for(let x=68;x<132;x+=6)r(x,114,3,2,'#ffd25a');
 // 书桌 + 电脑
 r(60,68,46,4,'#8a5a36');r(60,68,46,1,'#b07a4c');r(62,72,3,22,'#6b4428');r(101,72,3,22,'#6b4428');
 r(70,50,22,16,'#2b2b3a');r(72,52,18,12,'#0d1b2a');r(79,66,4,2,'#2b2b3a');r(74,66,14,2,'#444');
 const cur=(f>>4)&1;r(73,53,10,1,'#5ad1c8');r(73,55,7,1,'#5ad1c8');r(73,57,12,1,'#ffd25a');r(73,59,5,1,'#5ad1c8');if(cur)r(79,59,2,1,'#fff');
 r(94,62,6,6,'#fff');r(95,63,4,4,'#c46a2b'); // 杯子
 r(100,64,1,3,'#fff');
 // 台灯（落地灯）
 r(114,58,10,8,'#ffd25a');r(115,59,8,2,'#fff3a0');r(118,66,2,26,'#3a2a20');r(115,92,8,2,'#3a2a20');
 if(isLampOn()){X.fillStyle='rgba(255,220,120,.10)';X.beginPath();X.moveTo(114,66);X.lineTo(124,66);X.lineTo(136,106);X.lineTo(102,106);X.fill()}
 // 信箱 / 木牌
 r(18,78,2,24,'#5a3e2b');r(10,66,18,12,'#d64545');r(10,66,18,2,'#ff7070');r(12,70,10,1,'#7a1f1f');
 r(26,62,2,8,'#3a2a20');r(28,62,4,3,(f>>5)&1?'#ffd25a':'#f2c94c');
 // 夜晚整体变暗
 if(ph==='night'){X.fillStyle='rgba(10,10,40,.28)';X.fillRect(0,0,W,H)}else if(ph==='dusk'){X.fillStyle='rgba(255,120,60,.08)';X.fillRect(0,0,W,H)}
 drawBoxBack();
}


/* Baxa: registered multi-frame atlas; rigid sprites, fixed 60 Hz simulation. */
const SHEET=new Image();SHEET.onerror=()=>{SHEET.failed=true};SHEET.src='assets/baxa/animation-atlas.png';
const SW=24,SH=20,FRAMES=['sit','stand','walk','lie','sleep','look','groom','play','back','box'];
const FORCE=query.get('cat');
const cat={x:100,foot:114,dir:1,v:0,target:100,state:'sit',elapsed:0,duration:3,next:null,arrival:'sit',stride:0,meow:0,reactElapsed:0};
const CATS=[cat];
const random=(lo,hi)=>lo+Math.random()*(hi-lo);
function enter(state,duration,next=null){cat.state=state;cat.elapsed=0;cat.duration=duration;cat.next=next;cat.foot=state==='box'?BOX.foot:114;if(state==='box'){cat.x=BOX.catX;cat.v=0}updateCatStatus()}
function goHome(){
 cat.meow=0;cat.v=0;cat.target=BOX.catX;cat.arrival='box';cat.dir=cat.target>=cat.x?1:-1;
 if(Math.abs(cat.x-BOX.catX)<.4){enter('box',random(8,14));return}
 if(cat.state==='sleep')enter('lie',.65,['crouch','stand','walk']);
 else if(cat.state==='lie')enter('crouch',.4,['stand','walk']);
 else enter('stand',.4,'walk');
}
function leaveHome(after='sit'){cat.meow=0;cat.target=BOX.x-24;cat.arrival=after;cat.dir=-1;cat.v=0;enter('stand',.4,'walk')}
function pick(){
 const roll=Math.random(),previous=cat.state;
 if(roll<.4){
  const options=[28,50,74,98,122].filter(x=>Math.abs(x-cat.x)>24);
  cat.target=options[Math.floor(Math.random()*options.length)]+random(-3,3);
  cat.dir=Math.sign(cat.target-cat.x);cat.v=0;cat.arrival='sit';
  if(previous==='sleep')enter('lie',.65,['crouch','stand','walk']);
  else if(previous==='lie')enter('crouch',.4,['stand','walk']);
  else enter('stand',.4,'walk');
 }else if(roll<.9){
  const options=previous==='sleep'?['lie']:previous==='lie'?['sit','sleep']:['sit','lie','groom','look','back'];
  const state=options[Math.floor(Math.random()*options.length)];
  if(state==='lie'&&previous!=='sleep')enter('crouch',.35,'lie');else enter(state,state==='sleep'?random(9,16):random(3,6));
 }else{
  const activity=Math.random()<.5?'play':'box';
  if(activity==='box'){goHome();return}
  if(previous==='sleep')enter('lie',.65,['sit',activity]);
  else if(previous==='lie')enter('sit',.45,activity);
  else enter(activity,random(4,6));
 }
}
function updateCatStatus(){}
function stepCat(dt){
 if(cat.meow>0){cat.meow=Math.max(0,cat.meow-dt);cat.reactElapsed+=dt;if(!cat.meow)updateCatStatus();return}
 const forcedWalk=FORCE==='left'||FORCE==='right';
 if(forcedWalk){if(cat.state!=='walk')enter('walk',Infinity);cat.dir=FORCE==='left'?-1:1;cat.target=cat.x+cat.dir*50}
 else if(FRAMES.includes(FORCE)){if(cat.state!==FORCE)enter(FORCE,Infinity);cat.elapsed+=dt;return}
 cat.elapsed+=dt;
 if(cat.state==='walk'){
  const dist=cat.target-cat.x,desired=Math.sign(dist)*Math.min(17,Math.abs(dist)*3);
  cat.v+=(desired-cat.v)*(1-Math.exp(-9*dt));
  const move=cat.v*dt;
  cat.x+=move;cat.stride+=Math.abs(move);
  if(Math.abs(cat.v)>.5)cat.dir=Math.sign(cat.v);
  if(forcedWalk){if(cat.x<-SW)cat.x=W;if(cat.x>W)cat.x=-SW}
  else if(Math.abs(dist)<.35&&Math.abs(cat.v)<1.2){cat.x=cat.target;cat.v=0;enter('stand',.35,cat.arrival)}
 }else if(!FORCE&&cat.elapsed>=cat.duration){
  if(cat.next){const sequence=Array.isArray(cat.next)?[...cat.next]:[cat.next],next=sequence.shift();enter(next,next==='walk'?Infinity:next==='box'?random(8,14):sequence.length?.45:random(2.5,4.5),sequence.length?sequence:null)}
  else if(cat.state==='box')leaveHome();
  else if(cat.state==='groom'||cat.state==='play')enter('sit',random(1.5,2.5));
  else pick();
 }
 // Unknown debug strings must not freeze normal idle transitions.
 if(FORCE&&!forcedWalk&&!FRAMES.includes(FORCE)&&cat.elapsed>=cat.duration)pick();
}
const ATLAS=[{"sx":52,"sy":82,"sw":151,"sh":193,"dx":6,"w":13,"h":16},{"sx":309,"sy":82,"sw":151,"sh":193,"dx":6,"w":13,"h":16},{"sx":504,"sy":80,"sw":247,"sh":195,"dx":2,"w":21,"h":16},{"sx":775,"sy":81,"sw":238,"sh":194,"dx":4,"w":20,"h":16},{"sx":1077,"sy":77,"sw":153,"sh":198,"dx":5,"w":13,"h":16},{"sx":1333,"sy":78,"sw":151,"sh":197,"dx":5,"w":13,"h":16},{"sx":27,"sy":334,"sw":226,"sh":182,"dx":4,"w":19,"h":15},{"sx":278,"sy":326,"sw":233,"sh":190,"dx":3,"w":19,"h":16},{"sx":527,"sy":334,"sw":237,"sh":182,"dx":3,"w":20,"h":15},{"sx":777,"sy":337,"sw":235,"sh":179,"dx":2,"w":20,"h":15},{"sx":1034,"sy":344,"sw":235,"sh":172,"dx":3,"w":20,"h":14},{"sx":1297,"sy":400,"sw":216,"sh":116,"dx":5,"w":18,"h":10},{"sx":26,"sy":630,"sw":221,"sh":114,"dx":3,"w":18,"h":10},{"sx":282,"sy":630,"sw":221,"sh":114,"dx":3,"w":18,"h":10},{"sx":531,"sy":568,"sw":216,"sh":176,"dx":5,"w":18,"h":15},{"sx":811,"sy":569,"sw":178,"sh":175,"dx":8,"w":15,"h":15},{"sx":1041,"sy":564,"sw":217,"sh":180,"dx":5,"w":18,"h":15},{"sx":1339,"sy":561,"sw":139,"sh":183,"dx":6,"w":12,"h":15},{"sx":15,"sy":797,"sw":238,"sh":193,"dx":3,"w":20,"h":16},{"sx":271,"sy":797,"sw":241,"sh":193,"dx":2,"w":20,"h":16},{"sx":512,"sy":803,"sw":252,"sh":187,"dx":2,"w":21,"h":16},{"sx":824,"sy":862,"sw":144,"sh":113,"dx":6,"w":12,"h":9},{"sx":1079,"sy":862,"sw":145,"sh":113,"dx":6,"w":12,"h":9},{"sx":1337,"sy":862,"sw":143,"sh":113,"dx":6,"w":12,"h":9}];

function atlasIndex(name){
 const t=cat.elapsed,blink=!reduceMotion.matches&&worldTime%5.2>5.04;
 if(name==='sit')return blink?1:0;
 if(name==='stand')return 2;
 if(name==='look')return blink?5:4;
 if(name==='walk')return 6+(FORCE==='walk'?Math.floor(t*6):Math.floor(cat.stride/2))%4;
 if(name==='crouch')return 10;
 if(name==='lie')return 11;
 if(name==='sleep')return 12+(reduceMotion.matches?0:Math.floor(t/2.2)%2);
 if(name==='groom')return [14,15,16,15][Math.floor(t*3.5)%4];
 if(name==='back')return 17;
 if(name==='play')return [18,19,20,19][Math.floor(t*4)%4];
 if(name==='box')return blink?22:Math.floor(t/2.8)%2?23:21;
 return 0;
}
function frame(name,flip){
 const x=Math.round(cat.x);
 if(SHEET.failed||!SHEET.complete||!SHEET.naturalWidth){
  if(!SHEET.failed)return;
  r(x+6,cat.foot-10,12,10,'#231f29');r(x+7,cat.foot-12,3,3,'#231f29');r(x+14,cat.foot-12,3,3,'#231f29');r(x+10,cat.foot-5,6,5,'#ece1d4');return;
 }
 const m=ATLAS[atlasIndex(name)],foot=name==='box'?BOX.rim+1:cat.foot;
 X.save();X.imageSmoothingEnabled=false;X.translate(flip?x+SW:x,0);if(flip)X.scale(-1,1);
 X.drawImage(SHEET,m.sx,m.sy,m.sw,m.sh,m.dx,foot-m.h,m.w,m.h);
 X.restore();
}
function drawBoxPaws(){
 if(cat.state!=='box'||SHEET.failed||!SHEET.naturalWidth)return;
 const m=ATLAS[21];X.drawImage(SHEET,m.sx,m.sy+m.sh-24,m.sw,24,Math.round(cat.x)+m.dx,BOX.rim-1,m.w,2);
}
const HEART=['.kk.kk.','kppkppk','kpppppk','.kpppk.','..kpk..','...k...'];
const BALL=['..kkkk..','.kppppk.','kppwpppk','kpwpwppk','kppwpwpk','.kppppk.','..kkkk..'];
function drawCat(){
 const s=cat.state==='box'?'box':cat.meow>0?'look':cat.state,flip=cat.dir<0,t=cat.elapsed;
 frame(s,s==='box'?false:flip);
 if(s==='play'){
  const swing=reduceMotion.matches?0:Math.round((1-Math.cos(t*4.5))*1.5);
  const bx=Math.round(cat.x)+(flip?-8-swing:SW+swing),by=cat.foot-7;
  sprite(BALL,{k:'#47243d',p:'#ff86b3',w:'#ffe0ec'},bx,by);
  r(bx+(flip?8:-3),by+5,3,1,'#ffe0ec');r(bx+(flip?10:-4),by+4,1,2,'#ffe0ec');
 }
 if(s==='sleep'){
  const lift=reduceMotion.matches?0:Math.floor(worldTime%2.4);
  X.fillStyle='#ede2ff';X.font='5px monospace';X.textBaseline='top';X.fillText('z',Math.round(cat.x)+SW-2,cat.foot-SH-5-lift);
 }
 if(cat.meow>0){
  const hx=Math.max(2,Math.min(W-9,Math.round(cat.x)+(cat.meow>0?SW+7:5)));
  const lift=cat.meow>0?Math.min(4,Math.floor(cat.reactElapsed*2)):0;
  sprite(HEART,{k:'#47243d',p:'#ff86b3'},hx,cat.foot-SH-9-lift);
 }
 if(cat.meow>0){
  const bx=Math.max(2,Math.min(W-25,Math.round(cat.x)-9)),by=cat.foot-SH-13;
  r(bx,by,22,10,'#302640');r(bx+1,by+1,20,8,'#fbf2df');r(bx+12,by+10,2,2,'#302640');
  X.fillStyle='#302640';X.font='7px monospace';X.textBaseline='top';X.fillText('喵?',bx+3,by+1);
 }
}
function greetCat(){const atHome=cat.state==='box';cat.v=0;cat.meow=2.4;cat.reactElapsed=0;if(atHome){cat.elapsed=0;cat.duration=10}else enter('sit',3);updateCatStatus()}
function setPaused(value){paused=value}
reduceMotion.addEventListener('change',()=>setPaused(reduceMotion.matches));
if(reduceMotion.matches)setPaused(true);
let lastTime=null,accumulator=0;
function loop(now){
 const delta=lastTime===null?0:Math.min((now-lastTime)/1000,.1);lastTime=now;
 if(!paused&&!document.hidden){accumulator+=delta;while(accumulator>=1/60){worldTime+=1/60;stepCat(1/60);accumulator-=1/60}}
 X.clearRect(0,0,W,H);X.imageSmoothingEnabled=false;drawRoom(Math.floor(worldTime*60));drawCat();drawBoxFront();drawBoxPaws();requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{lastTime=null;accumulator=0});

let typing=null,artworkIndex=null;
function say(title,text,top,img){artworkIndex=null;clearInterval(typing);dlg.classList.toggle('top',!!top);dlg.style.display='block';dlg.innerHTML='<b></b><br><span></span>';dlg.querySelector('b').textContent=title;if(img){const im=document.createElement('img');im.src=img;im.alt=title;dlg.appendChild(im)}const sp=dlg.querySelector('span');let i=0;typing=setInterval(()=>{sp.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typing)},28)}
dlg.onclick=e=>{e.stopPropagation();dlg.style.display='none'};

function showArtwork(g){
 let image=g.img;
 if(!image){const p=document.createElement('canvas'),ctx=p.getContext('2d'),unit=20;p.width=g.pixels[0].length*unit;p.height=g.pixels.length*unit;g.pixels.forEach((row,y)=>[...row].forEach((ch,x)=>{if(g.palette[ch]){ctx.fillStyle=g.palette[ch];ctx.fillRect(x*unit,y*unit,unit,unit)}}));image=p.toDataURL()}
 say('🖼 '+g.title+' · '+g.year,g.desc,true,image);
 artworkIndex=GALLERY.indexOf(g);
 const row=document.createElement('div');row.className='art-row';const im=dlg.querySelector('img');
 const arrow=(label,direction)=>{const button=document.createElement('button');button.type='button';button.className='art-arrow';button.textContent=direction<0?'◀':'▶';button.setAttribute('aria-label',label);button.onclick=e=>{e.stopPropagation();showArtwork(GALLERY[(artworkIndex+direction+GALLERY.length)%GALLERY.length]);dlg.querySelector(direction<0?'[aria-label="上一张画"]':'[aria-label="下一张画"]').focus({preventScroll:true})};return button};
 row.append(arrow('上一张画',-1),im,arrow('下一张画',1));dlg.append(row);
}
galleryLayout().forEach(({g,x,y,w,h})=>add(x,y,w,h,()=>showArtwork(g)));
add(68,48,26,22,()=>say('💻 电脑','这是 Bao 的电脑。\nBao：哈尔滨工程大学毕业，在水下机器人公司做嵌入式工程师。\n平时写 C/C++，玩 STM32、RTOS、ArduSub 和 ROS；\n在学校时做过 AUV/ROV，也打过水下机器人比赛。'));
add(8,60,26,44,()=>say('📮 信箱','想给 Bao 写信？\n✉ Email：（待填写）\n🐙 GitHub：（待填写）\n旗子立起来了，说明……有新邮件？'));
add(156,34,30,56,()=>say('📚 书架','《STM32 从入门到冒烟》《RTOS 的一百种死锁》\n《ROS 与它的依赖地狱》《深海漫游指南》'));
add(8,12,40,34,()=>say('🪟 窗户',{day:'外面阳光正好，适合出海测试。',dusk:'黄昏了，ROV 该回收了。',night:'夜深了，星星出来了。猫还没睡。'}[phase()]));
add(112,56,14,38,()=>say('💡 台灯','啪嗒。灯光暖暖的。\n（灯会在傍晚和夜里自己亮起来）'));
add(60,68,46,26,()=>say('🪑 书桌','桌上有一杯咖啡，已经凉了。'));

// 固定小窝只在场景内点击，不添加额外按钮或面板。
add(BOX.x-3,BOX.y,BOX.w+6,BOX.h+2,()=>{if(cat.state!=='box')goHome();say('📦 Baxa 的小窝',cat.state==='box'?'Baxa 正窝在箱子里。\n这是它固定的小角落。':'Baxa 慢慢走回自己的纸箱小窝。',true)});
function hit(x,y){
 if(x>=cat.x+2&&x<=cat.x+SW-2&&y>=cat.foot-SH&&y<=cat.foot)return 'cat';
 // Smaller overlapping objects (the computer above the desk) take precedence.
 return items.filter(it=>x>=it.x&&x<it.x+it.w&&y>=it.y&&y<it.y+it.h).sort((a,b)=>a.w*a.h-b.w*b.h)[0];
}
function point(e){const b=C.getBoundingClientRect();return {x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}
C.addEventListener('pointermove',e=>{const p=point(e);C.style.cursor=hit(p.x,p.y)?'pointer':'default'});
C.addEventListener('click',e=>{
 const p=point(e),item=hit(p.x,p.y);
 if(item==='cat'){greetCat();say('🐈‍⬛ Baxa · 小屋的主人','Baxa 是 Bao 家的长毛奶牛猫。\n黑色蓬松大毛毛 + 白围兜 + 四只白手套，\n眼睛盯着你：“有罐罐吗？”',true)}
 else if(item)item.fn();else{clearInterval(typing);dlg.style.display='none'}
});
addEventListener('keydown',e=>{if(e.key==='Escape'){clearInterval(typing);dlg.style.display='none'}else if(artworkIndex!==null&&dlg.style.display!=='none'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();showArtwork(GALLERY[(artworkIndex+(e.key==='ArrowRight'?1:-1)+GALLERY.length)%GALLERY.length])}});
if(FRAMES.includes(FORCE))enter(FORCE,Infinity);
fit();requestAnimationFrame(loop);
