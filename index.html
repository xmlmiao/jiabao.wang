/* 图片类画作：img=点开后显示的大图，thumb=墙上的小缩略图（w×h 像素） */
GALLERY.forEach(g=>{if(g.thumb){g.timg=new Image();g.timg.src=g.thumb}});


const C=document.getElementById('c'),X=C.getContext('2d'),W=192,H=128;
const dlg=document.getElementById('dlg'),stage=document.getElementById('stage');
const query=new URLSearchParams(location.search),reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
const r=(x,y,w,h,c)=>{X.fillStyle=c;X.fillRect(x,y,w,h)};
function sprite(px,pal,x,y,flip){px.forEach((row,j)=>[...row].forEach((ch,i)=>{if(ch!=='.'&&pal[ch])r(flip?x+row.length-1-i:x+i,y+j,1,1,pal[ch])}))}
let timeMode=['day','dusk','night'].includes(query.get('phase'))?query.get('phase'):'auto';
let lampOverride=null,paused=false,worldTime=0,hovered=null,pressed=null,keyboardIndex=-1;
const TIME_NAMES={auto:'自动',day:'白天',dusk:'黄昏',night:'夜晚'};
function phase(){if(timeMode!=='auto')return timeMode;const h=new Date().getHours();return h>=6&&h<17?'day':h>=17&&h<19?'dusk':'night'}
function isLampOn(){return lampOverride===null?phase()!=='day':lampOverride}
function fit(){
 const available=document.querySelector('.app').clientWidth-(innerWidth<=600?18:24);
 const raw=Math.min(available/W,Math.max(220,innerHeight-244)/H,5);
 const scale=raw>=2?Math.floor(raw):raw;
 C.style.width=W*scale+'px';C.style.height=H*scale+'px';
 document.querySelector('.room-wrap').style.width=(W*scale+(innerWidth<=600?10:16))+'px';
 hideTip();
}
addEventListener('resize',fit);
const items=[];
function add(id,label,x,y,w,h,fn){const item={id,label,x,y,w,h,fn};items.push(item);return item}
const BOX={x:149,y:101,w:30,h:20,catX:154,foot:117};
function drawBoxBack(){const {x,y,w,h}=BOX;r(x-1,y+h,w+2,2,'#50352866');r(x+2,y+2,w-4,8,'#c18b58');r(x+3,y+5,w-6,8,'#51372e');r(x+2,y+4,w-4,2,'#e2b17c');r(x-3,y+7,6,3,'#d9a36d');r(x+w-3,y+7,6,3,'#d9a36d')}
function drawBoxFront(){const {x,y,w}=BOX;r(x,y+11,w,10,'#b57a4b');r(x,y+11,w,1,'#e2b17c');r(x+1,y+12,w-2,1,'#c9925e');r(x,y+19,w,2,'#81522f');r(x+13,y+12,4,7,'#d7ab73');r(x+14,y+12,1,7,'#e8bf8c');r(x+3,y+14,4,1,'#81522f');r(x+4,y+13,2,3,'#81522f')}
function galleryLayout(){
 const feat=GALLERY.filter(g=>g.featured),rest=GALLERY.filter(g=>!g.featured);
 const half=Math.ceil(rest.length/2),order=[...rest.slice(0,half),...feat,...rest.slice(half)];
 const dims=order.map(g=>({g,w:(g.pixels?g.pixels[0].length:g.w)+4,h:(g.pixels?g.pixels.length:g.h)+4}));
 const L=52,R=152,total=dims.reduce((a,d)=>a+d.w,0),gap=Math.max(1,Math.floor((R-L-total)/Math.max(1,dims.length-1)));
 let x=L+Math.floor((R-L-total-gap*(dims.length-1))/2);const base=32;
 return dims.map(d=>{const o={...d,x,y:base-d.h};x+=d.w+gap;return o});
}
function drawRoom(f){
 const ph=phase();
 // 墙
 r(0,0,W,90,'#6b4f8a');for(let x=0;x<W;x+=8)r(x,0,1,90,'#634780');
 r(0,84,W,6,'#4a3466');r(0,84,W,1,'#8a6aa8');
 // 地板
 r(0,90,W,38,'#a0663d');for(let y=90;y<H;y+=6){r(0,y,W,1,'#7d4a2a');for(let x=(y/6%2)*12;x<W;x+=24)r(x,y,1,6,'#7d4a2a')}
 // 窗户（天空内容裁剪在玻璃内，不会画到墙上）
 const sky={day:'#8fd3ff',dusk:'#ff9e6b',night:'#1a1f4a'}[ph];
 const wx=12,wy=16,ww=32,wh=26;
 r(10,14,36,30,'#3a2a20');r(wx,wy,ww,wh,sky);
 X.save();X.beginPath();X.rect(wx,wy,ww,wh);X.clip();
 if(ph==='night'){r(34,20,4,4,'#fff6c2');r(35,21,3,3,sky);[[16,20],[24,30],[40,34],[20,36],[28,22]].forEach(([a,b],i)=>{if((f>>4)+i&1)r(a,b,1,1,'#fff')})}
 else{r(ph==='day'?36:16,ph==='day'?20:32,5,5,ph==='day'?'#fff3a0':'#ffe08a');
  // 云从左飘到右；?cloud=edge 强制贴右缘，方便截图验收
  const force=query.get('cloud');
  const cx=force==='edge'?wx+ww-6:wx+((f>>3)%(ww+16))-8;
  r(cx,24,8,2,'#fff');r(cx+2,23,4,1,'#fff')}
 X.restore();
 r(27,wy,2,wh,'#3a2a20');r(wx,28,ww,2,'#3a2a20');r(8,43,40,3,'#5a3e2b');
 // 窗台植物
 r(36,38,6,5,'#c0603a');r(37,34,1,4,'#4caf50');r(39,32,1,6,'#2e7d32');r(40,35,2,1,'#4caf50');r(35,36,2,1,'#4caf50');
 // 画廊
 galleryLayout().forEach(({g,x,y,w,h})=>{r(x,y,w,h,'#3a2a20');r(x+1,y+1,w-2,h-2,g.featured?'#f2c94c':'#d9a441');
   if(g.timg){if(g.timg.naturalWidth)X.drawImage(g.timg,x+2,y+2,g.w,g.h);return}
   const pal=g.palette;g.pixels.forEach((row,j)=>[...row].forEach((ch,k)=>{if(pal[ch])r(x+2+k,y+2+j,1,1,pal[ch])}))});
 // 书架
 r(156,34,30,56,'#5a3e2b');r(158,36,26,52,'#3a2a20');
 const bc=['#e45b5b','#5bb0e4','#f2c94c','#6fcf97','#bb6bd9','#f2994a'];
 [36,53,70].forEach((y,s)=>{r(158,y+15,26,2,'#5a3e2b');for(let i=0;i<7;i++){const hh=10+((i*7+s*3)%5);r(159+i*3+(i>4?2:0),y+15-hh,3,hh,bc[(i+s)%6]);r(159+i*3+(i>4?2:0),y+15-hh+2,3,1,'rgba(255,255,255,.35)')}});
 // 地毯
 r(64,108,72,14,'#2f6f8f');r(66,110,68,10,'#3f8fb0');for(let x=68;x<132;x+=6)r(x,114,3,2,'#ffd25a');
 // 书桌 + 电脑
 r(60,68,46,4,'#8a5a36');r(60,68,46,1,'#b07a4c');r(62,72,3,22,'#6b4428');r(101,72,3,22,'#6b4428');
 r(70,50,22,16,'#2b2b3a');r(72,52,18,12,'#0d1b2a');r(79,66,4,2,'#2b2b3a');r(74,66,14,2,'#444');
 const cur=(f>>4)&1;r(73,53,10,1,'#5ad1c8');r(73,55,7,1,'#5ad1c8');r(73,57,12,1,'#ffd25a');r(73,59,5,1,'#5ad1c8');if(cur)r(79,59,2,1,'#fff');
 r(94,62,6,6,'#fff');r(95,63,4,4,'#c46a2b'); // 杯子
 r(100,64,1,3,'#fff');
 // 台灯（落地灯）
 r(114,58,10,8,isLampOn()?'#ffd25a':'#9c8b87');r(115,59,8,2,isLampOn()?'#fff3a0':'#c2b4aa');r(118,66,2,26,'#3a2a20');r(115,92,8,2,'#3a2a20');
 if(isLampOn()){X.fillStyle='rgba(255,220,120,.10)';X.beginPath();X.moveTo(114,66);X.lineTo(124,66);X.lineTo(136,106);X.lineTo(102,106);X.fill()}
 // 信箱 / 木牌
 r(18,78,2,24,'#5a3e2b');r(10,66,18,12,'#d64545');r(10,66,18,2,'#ff7070');r(12,70,10,1,'#7a1f1f');
 r(26,62,2,8,'#3a2a20');r(28,62,4,3,(f>>5)&1?'#ffd25a':'#f2c94c');
 // 夜晚整体变暗
 if(ph==='night'){X.fillStyle='rgba(10,10,40,.28)';X.fillRect(0,0,W,H)}else if(ph==='dusk'){X.fillStyle='rgba(255,120,60,.08)';X.fillRect(0,0,W,H)}
 drawBoxBack();
}


/* Baxa: original 18x14 sprites, fixed 60 Hz simulation; all durations use seconds. */
const SHEET=new Image();SHEET.onerror=()=>{SHEET.failed=true};SHEET.src='assets/baxa/sheet.png';
const SW=18,SH=14,FRAMES=['sit','stand','walk','lie','sleep','look','groom','play','back','box'];
const FORCE=query.get('cat');
const cat={x:100,foot:114,dir:1,v:0,target:100,state:'sit',elapsed:0,duration:3,next:null,arrival:'sit',stride:0,meow:0,reactElapsed:0};
const CATS=[cat];
const random=(lo,hi)=>lo+Math.random()*(hi-lo);
function enter(state,duration,next=null){cat.state=state;cat.elapsed=0;cat.duration=duration;cat.next=next;cat.foot=state==='box'?BOX.foot:114;if(state==='box'){cat.x=BOX.catX;cat.v=0}updateCatStatus()}
function goHome(){
 cat.meow=0;cat.v=0;cat.target=BOX.catX;cat.arrival='box';cat.dir=cat.target>=cat.x?1:-1;
 if(Math.abs(cat.x-BOX.catX)<.4){enter('box',random(8,14));return}
 if(cat.state==='sleep')enter('lie',.65,['sit','stand','walk']);
 else if(cat.state==='lie')enter('sit',.45,['stand','walk']);
 else enter('stand',.4,'walk');
}
function leaveHome(after='sit'){cat.meow=0;cat.target=BOX.x-24;cat.arrival=after;cat.dir=-1;cat.v=0;enter('stand',.4,'walk')}
function pick(){
 const roll=Math.random(),previous=cat.state;
 if(roll<.4){
  const options=[28,50,74,98,122].filter(x=>Math.abs(x-cat.x)>24);
  cat.target=options[Math.floor(Math.random()*options.length)]+random(-3,3);
  cat.dir=Math.sign(cat.target-cat.x);cat.v=0;cat.arrival='sit';
  if(previous==='sleep')enter('lie',.65,['sit','stand','walk']);
  else if(previous==='lie')enter('sit',.45,['stand','walk']);
  else enter('stand',.4,'walk');
 }else if(roll<.9){
  const options=previous==='sleep'?['lie']:previous==='lie'?['sit','sleep']:['sit','lie','groom','look','back'];
  const state=options[Math.floor(Math.random()*options.length)];
  enter(state,state==='sleep'?random(9,16):random(3,6));
 }else{
  const activity=Math.random()<.5?'play':'box';
  if(activity==='box'){goHome();return}
  if(previous==='sleep')enter('lie',.65,['sit',activity]);
  else if(previous==='lie')enter('sit',.45,activity);
  else enter(activity,random(4,6));
 }
}
function updateCatStatus(){
 const labels={sit:'在发呆',stand:'站起来看看',walk:cat.arrival==='box'?'正在回窝':'溜达中',lie:'在躺平',sleep:'睡着了',look:'在看你',groom:'在舔毛',play:'在玩毛线球',back:'在看风景',box:'在小窝里'};
 document.getElementById('cat-status').textContent=paused?'Baxa 休息一下':'Baxa '+(cat.meow>0?'在和你打招呼':labels[cat.state]);
}
function stepCat(dt){
 if(cat.meow>0){cat.meow=Math.max(0,cat.meow-dt);cat.reactElapsed+=dt;if(!cat.meow)updateCatStatus();return}
 const forcedWalk=FORCE==='left'||FORCE==='right';
 if(forcedWalk){if(cat.state!=='walk')enter('walk',Infinity);cat.dir=FORCE==='left'?-1:1;cat.target=cat.x+cat.dir*50}
 else if(FRAMES.includes(FORCE)){if(cat.state!==FORCE)enter(FORCE,Infinity);cat.elapsed+=dt;return}
 cat.elapsed+=dt;
 if(cat.state==='walk'){
  const dist=cat.target-cat.x,desired=Math.sign(dist)*Math.min(17,Math.abs(dist)*3);
  cat.v+=(desired-cat.v)*(1-Math.exp(-9*dt));
  const move=cat.v*dt;
  cat.x+=move;cat.stride+=Math.abs(move);
  if(Math.abs(cat.v)>.5)cat.dir=Math.sign(cat.v);
  if(forcedWalk){if(cat.x<-SW)cat.x=W;if(cat.x>W)cat.x=-SW}
  else if(Math.abs(dist)<.35&&Math.abs(cat.v)<1.2){cat.x=cat.target;cat.v=0;enter('stand',.35,cat.arrival)}
 }else if(!FORCE&&cat.elapsed>=cat.duration){
  if(cat.next){const sequence=Array.isArray(cat.next)?[...cat.next]:[cat.next],next=sequence.shift();enter(next,next==='walk'?Infinity:next==='box'?random(8,14):sequence.length?.45:random(2.5,4.5),sequence.length?sequence:null)}
  else if(cat.state==='box')leaveHome();
  else if(cat.state==='groom'||cat.state==='play')enter('sit',random(1.5,2.5));
  else pick();
 }
 // Unknown debug strings must not freeze normal idle transitions.
 if(FORCE&&!forcedWalk&&!FRAMES.includes(FORCE)&&cat.elapsed>=cat.duration)pick();
}
const EYES={sit:[[5,5],[7,5]],stand:[[11,5],[13,5],[14,5],[14,6]],walk:[[12,7],[14,7],[15,7]],lie:[[13,10],[14,10],[15,10],[13,11],[15,11]],look:[[11,4],[13,4],[10,5]],groom:[[10,6],[12,6],[13,7]],box:[[7,7],[8,7],[10,7]]};
function frame(name,flip,height=SH){
 const x=Math.round(cat.x),y=cat.foot-height;
 if(SHEET.failed||!SHEET.complete||!SHEET.naturalWidth){
  if(!SHEET.failed)return;
  X.save();if(flip){X.translate(x+SW,0);X.scale(-1,1)}else X.translate(x,0);
  r(3,cat.foot-10,12,9,'#231f29');r(4,cat.foot-12,3,3,'#231f29');r(11,cat.foot-12,3,3,'#231f29');r(7,cat.foot-5,6,4,'#ece1d4');r(6,cat.foot-8,1,1,'#cdd457');r(12,cat.foot-8,1,1,'#cdd457');r(4,cat.foot-1,3,1,'#ece1d4');r(12,cat.foot-1,3,1,'#ece1d4');X.restore();return;
 }
 const i=Math.max(0,FRAMES.indexOf(name));
 X.save();X.imageSmoothingEnabled=false;X.translate(flip?x+SW:x,y);if(flip)X.scale(-1,1);
 // Remove baked-in tiny yarn / sleep marks before drawing their animated versions.
 const sx=name==='play'?3:0,sy=name==='sleep'?6:0,dy=Math.round(sy*height/SH);
 if(name==='box')X.drawImage(SHEET,i*SW+6,4,7,5,6,4,7,5);
 else X.drawImage(SHEET,i*SW+sx,sy,SW-sx,SH-sy,sx,dy,SW-sx,height-dy);
 if(!reduceMotion.matches&&worldTime%5.6>5.44)(EYES[name]||[]).forEach(([ex,ey])=>r(ex,Math.round(ey*height/SH),1,1,'#231f29'));
 X.restore();
}
const HEART=['.kk.kk.','kppkppk','kpppppk','.kpppk.','..kpk..','...k...'];
const BALL=['..kkkk..','.kppppk.','kppwpppk','kpwpwppk','kppwpwpk','.kppppk.','..kkkk..'];
function drawCat(){
 const s=cat.meow>0?'look':cat.state,flip=cat.dir<0,t=cat.elapsed;
 let pose=s;
 if(s==='walk')pose=FORCE==='walk'?'walk':Math.floor(cat.stride/3)%2?'walk':'stand';
 if(s==='groom')pose=t%1.5<1.15?'groom':'sit';
 const breathing=!reduceMotion.matches&&['sit','lie','sleep'].includes(s)&&Math.sin(worldTime*1.6)>.8;
 const crouch=s==='play'&&!reduceMotion.matches&&t%1.4<.35;
 // The play sprite faces left in the source sheet; keep the toy beside its paws.
 frame(pose,s==='play'?!flip:flip,breathing||crouch?SH-1:SH);
 if(s==='play'){
  const swing=reduceMotion.matches?0:Math.round((1-Math.cos(t*4.5))*1.5);
  const bx=Math.round(cat.x)+(flip?-8-swing:SW+swing),by=cat.foot-7;
  sprite(BALL,{k:'#47243d',p:'#ff86b3',w:'#ffe0ec'},bx,by);
  r(bx+(flip?8:-3),by+5,3,1,'#ffe0ec');r(bx+(flip?10:-4),by+4,1,2,'#ffe0ec');
 }
 if(s==='sleep'){
  const lift=reduceMotion.matches?0:Math.floor(worldTime%2.4);
  X.fillStyle='#ede2ff';X.font='5px monospace';X.textBaseline='top';X.fillText('z',Math.round(cat.x)+SW-2,cat.foot-SH-5-lift);
 }
 if(s==='groom'||cat.meow>0){
  const hx=Math.max(2,Math.min(W-9,Math.round(cat.x)+(cat.meow>0?SW+7:5)));
  const lift=cat.meow>0?Math.min(4,Math.floor(cat.reactElapsed*2)):0;
  sprite(HEART,{k:'#47243d',p:'#ff86b3'},hx,cat.foot-SH-9-lift);
 }
 if(cat.meow>0){
  const bx=Math.max(2,Math.min(W-25,Math.round(cat.x)-9)),by=cat.foot-SH-13;
  r(bx,by,22,10,'#302640');r(bx+1,by+1,20,8,'#fbf2df');r(bx+12,by+10,2,2,'#302640');
  X.fillStyle='#302640';X.font='7px monospace';X.textBaseline='top';X.fillText('喵?',bx+3,by+1);
 }
}

let lastTime=null,accumulator=0;
function loop(now){
 const delta=lastTime===null?0:Math.min((now-lastTime)/1000,.1);lastTime=now;
 if(!paused&&!document.hidden){accumulator+=delta;while(accumulator>=1/60){worldTime+=1/60;stepCat(1/60);accumulator-=1/60}}

function isBackdrop(e){const b=dlg.getBoundingClientRect();return e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom}

function hitTest(x,y,touch=false){
 const candidates=items.map(item=>{const b=bounds(item);const dx=Math.max(b.x-x,0,x-b.x-b.w),dy=Math.max(b.y-y,0,y-b.y-b.h);return {item,b,d:Math.hypot(dx,dy)}}).filter(c=>c.d<=(touch?4:0));
 candidates.sort((a,b)=>a.d-b.d||(a.item===catItem?-1:b.item===catItem?1:0)||(a.b.w*a.b.h-b.b.w*b.b.h)||Math.hypot(x-a.b.x-a.b.w/2,y-a.b.y-a.b.h/2)-Math.hypot(x-b.b.x-b.b.w/2,y-b.b.y-b.b.h/2));
 return candidates[0]?.item||null;
}
function point(e){const b=C.getBoundingClientRect();return {x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}
