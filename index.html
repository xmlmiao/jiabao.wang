<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bao 的像素小屋 · jiabao.wang</title>
<meta name="description" content="Bao 的像素风数字资产小屋">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%23f2a65a'/><rect x='1' y='0' width='1' height='2' fill='%23f2a65a'/><rect x='2' y='3' width='1' height='1' fill='%23222'/><rect x='5' y='3' width='1' height='1' fill='%23222'/></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1b1b2f;color:#f4ecd8;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;min-height:100vh}
body{display:flex;flex-direction:column;align-items:center;padding:20px 8px 40px;gap:14px}
h1{font-size:18px;letter-spacing:2px;text-shadow:2px 2px 0 #000;text-align:center}
h1 small{display:block;font-size:12px;color:#9aa3c7;letter-spacing:1px;margin-top:4px;text-shadow:none}
#stage{position:relative;border:4px solid #000;box-shadow:0 0 0 4px #5a4a78,0 0 0 8px #000,8px 12px 0 8px rgba(0,0,0,.35)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;background:#fdf6e3;color:#2b2140;border:4px solid #2b2140;box-shadow:inset -4px -4px 0 #d8c9a3,inset 4px 4px 0 #fff,4px 4px 0 rgba(0,0,0,.4);padding:12px 14px 14px;font-size:14px;line-height:1.7;display:none;white-space:pre-line;cursor:pointer}
#dlg b{display:inline-block;background:#2b2140;color:#fdf6e3;padding:0 6px;margin-bottom:4px}
#dlg:after{content:"▼";position:absolute;right:10px;bottom:4px;font-size:10px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.hint{font-size:12px;color:#9aa3c7;text-align:center;line-height:1.8}
@media(max-width:500px){body{padding:16px 4px 32px}#stage{border-width:2px;box-shadow:0 0 0 2px #5a4a78,0 0 0 4px #000}}
footer{font-size:11px;color:#5d6488}
</style>
</head>
<body>
<h1>✦ Bao 的像素小屋 ✦<small>digital asset cottage · jiabao.wang</small></h1>
<div id="stage"><canvas id="c" width="192" height="128" aria-label="像素小屋场景"></canvas><div id="dlg" role="dialog" aria-live="polite"></div></div>
<p class="hint">点点房间里的东西：猫、画、电脑、信箱、书架、窗户…<br>tap anything in the room</p>
<footer>© 2026 Bao · made with ♥ & pixels</footer>
<script>
/* ===== 画廊数据：在这里添加新的像素画（见 README.md） =====
   pixels: 每行一个字符串，字符对应 palette 里的颜色，"." 表示透明 */
const GALLERY = [
  { title:"橘猫 Mochi", year:"2026", desc:"小屋的主人（自封的）。\n喜欢趴在键盘上，帮忙写 bug。",
    palette:{o:"#f2a65a",d:"#c46a2b",k:"#222034",w:"#fff",p:"#ff8fa3",b:"#7ec8e3"},
    pixels:["bbbbbbbbbbbb","bobbbbbbbobb","boobbbbboobb","bdooooooodbb","bokooooookbb","bowoopppowbb","booooooooobb","bbdooooodbbb","bboooooooobb","bboodbbdoobb","bbbbbbbbbbbb","bbbbbbbbbbbb"] },
  { title:"深海小鱼", year:"2026", desc:"在 2000 米水深游泳的小鱼。\n它不知道有个 ROV 正在看它。",
    palette:{n:"#14325c",l:"#1f4f8a",y:"#ffd25a",r:"#ff7a59",k:"#222034",w:"#fff",g:"#5ad1c8"},
    pixels:["nnnnnnnnnnnn","nnnwnnnnnnnn","nnnnnnnnnwnn","nnnnyyyynnnn","nrnyyyyyynnn","nrryykyyyynn","nrryyyyyrynn","nrnyyyyyynnn","nnnnyyyynnnn","ngnnnnnnngnn","gglgnnnngglg","llllllllllll"] },
  { title:"小 ROV", year:"2026", desc:"向本职工作致敬：一台小小的水下机器人。\nSTM32 + RTOS 驱动，螺旋桨呼呼转。",
    palette:{n:"#0f2a4a",y:"#ffcc33",k:"#222034",c:"#9fe8ff",g:"#8b93a6",w:"#e8f6ff"},
    pixels:["nnnnnnnnnnnn","nnnnnwnnnnnn","nnnnnggnnnnn","nnyyyyyyyynn","nykyyyyyykyn","nyycccyyyyyn","ncwcycyyyyyn","nyycccyyyyyn","nykyyyyyykyn","nnyyyyyyyynn","ngnggnnggngn","nnnnnnnnnnnn"] },
  { title:"窗台绿萝", year:"2026", desc:"唯一一个不需要烧录固件\n就能自己长大的东西。",
    palette:{e:"#f3e2c7",g:"#4caf50",G:"#2e7d32",t:"#c0603a",T:"#8a3d22"},
    pixels:["eeeeeeeeeeee","eeeeegeeeeee","eeegGgegeeee","eegGgggGgeee","eeeGgGgggGee","eegggGgGgeee","eeeGgggGeeee","eeeettttteee","eeeetTTTteee","eeeetttteeee","eeeeTTTTeeee","eeeeeeeeeeee"] },
];

const C = document.getElementById('c'), X = C.getContext('2d'), W=192, H=128;
const dlg = document.getElementById('dlg'), stage = document.getElementById('stage');
const r=(x,y,w,h,c)=>{X.fillStyle=c;X.fillRect(x,y,w,h)};
function sprite(px,pal,x,y,flip){px.forEach((row,j)=>{[...row].forEach((ch,i)=>{if(ch!=='.'&&pal[ch]){r(flip?x+row.length-1-i:x+i,y+j,1,1,pal[ch])}})})}

/* ---- 缩放：保持整数倍 ---- */
function fit(){const pad=innerWidth<500?24:32,raw=Math.min((innerWidth-pad)/W,(innerHeight-150)/H,6);let s=Math.floor(raw);if(s<2)s=Math.max(1,(innerWidth-pad)/W);/* 窄屏允许非整数倍，保证占满宽度 */C.style.width=W*s+'px';C.style.height=H*s+'px';dlg.style.fontSize=(s<=2?12:14)+'px'}
addEventListener('resize',fit);fit();

/* ---- 时间：白天/黄昏/夜晚 ---- */
function phase(){const h=new Date().getHours();return h>=6&&h<17?'day':h>=17&&h<19?'dusk':'night'}

/* ---- 可点击物体 ---- */
const items=[];
function add(x,y,w,h,fn){items.push({x,y,w,h,fn})}

function drawRoom(f){
 const ph=phase();
 // 墙
 r(0,0,W,90,'#6b4f8a');for(let x=0;x<W;x+=8)r(x,0,1,90,'#634780');
 r(0,84,W,6,'#4a3466');r(0,84,W,1,'#8a6aa8');
 // 地板
 r(0,90,W,38,'#a0663d');for(let y=90;y<H;y+=6){r(0,y,W,1,'#7d4a2a');for(let x=(y/6%2)*12;x<W;x+=24)r(x,y,1,6,'#7d4a2a')}
 // 窗户
 const sky={day:'#8fd3ff',dusk:'#ff9e6b',night:'#1a1f4a'}[ph];
 r(10,14,36,30,'#3a2a20');r(12,16,32,26,sky);
 if(ph==='night'){r(34,20,4,4,'#fff6c2');r(35,21,3,3,sky);[[16,20],[24,30],[40,34],[20,36],[28,22]].forEach(([a,b],i)=>{if((f>>4)+i&1)r(a,b,1,1,'#fff')})}
 else{r(ph==='day'?36:16,ph==='day'?20:32,5,5,ph==='day'?'#fff3a0':'#ffe08a');const cx=((f>>3)%48)-8;r(12+((cx+48)%40),24,8,2,'#fff');r(14+((cx+48)%40),23,4,1,'#fff')}
 r(27,16,2,26,'#3a2a20');r(12,28,32,2,'#3a2a20');r(8,43,40,3,'#5a3e2b');
 // 窗台植物
 r(36,38,6,5,'#c0603a');r(37,34,1,4,'#4caf50');r(39,32,1,6,'#2e7d32');r(40,35,2,1,'#4caf50');r(35,36,2,1,'#4caf50');
 // 画廊
 GALLERY.forEach((g,i)=>{const fx=58+i*24,fy=14;r(fx,fy,18,18,'#3a2a20');r(fx+1,fy+1,16,16,'#d9a441');r(fx+2,fy+2,14,14,'#3a2a20');
   const pal=g.palette;g.pixels.forEach((row,j)=>[...row].forEach((ch,k)=>{if(pal[ch])r(fx+3+k,fy+3+j,1,1,pal[ch])}))});
 // 书架
 r(156,34,30,56,'#5a3e2b');r(158,36,26,52,'#3a2a20');
 const bc=['#e45b5b','#5bb0e4','#f2c94c','#6fcf97','#bb6bd9','#f2994a'];
 [36,53,70].forEach((y,s)=>{r(158,y+15,26,2,'#5a3e2b');for(let i=0;i<7;i++){const hh=10+((i*7+s*3)%5);r(159+i*3+(i>4?2:0),y+15-hh,3,hh,bc[(i+s)%6]);r(159+i*3+(i>4?2:0),y+15-hh+2,3,1,'rgba(255,255,255,.35)')}});
 // 地毯
 r(64,108,72,14,'#2f6f8f');r(66,110,68,10,'#3f8fb0');for(let x=68;x<132;x+=6)r(x,114,3,2,'#ffd25a');
 // 书桌 + 电脑
 r(60,68,46,4,'#8a5a36');r(60,68,46,1,'#b07a4c');r(62,72,3,22,'#6b4428');r(101,72,3,22,'#6b4428');
 r(70,50,22,16,'#2b2b3a');r(72,52,18,12,'#0d1b2a');r(79,66,4,2,'#2b2b3a');r(74,66,14,2,'#444');
 const cur=(f>>4)&1;r(73,53,10,1,'#5ad1c8');r(73,55,7,1,'#5ad1c8');r(73,57,12,1,'#ffd25a');r(73,59,5,1,'#5ad1c8');if(cur)r(79,59,2,1,'#fff');
 r(94,62,6,6,'#fff');r(95,63,4,4,'#c46a2b'); // 杯子
 r(100,64,1,3,'#fff');
 // 台灯（落地灯）
 r(114,58,10,8,'#ffd25a');r(115,59,8,2,'#fff3a0');r(118,66,2,26,'#3a2a20');r(115,92,8,2,'#3a2a20');
 if(ph!=='day'){X.fillStyle='rgba(255,220,120,.10)';X.beginPath();X.moveTo(114,66);X.lineTo(124,66);X.lineTo(136,106);X.lineTo(102,106);X.fill()}
 // 信箱 / 木牌
 r(18,78,2,24,'#5a3e2b');r(10,66,18,12,'#d64545');r(10,66,18,2,'#ff7070');r(12,70,10,1,'#7a1f1f');
 r(26,62,2,8,'#3a2a20');r(28,62,4,3,(f>>5)&1?'#ffd25a':'#f2c94c');
 // 夜晚整体变暗
 if(ph==='night'){X.fillStyle='rgba(10,10,40,.28)';X.fillRect(0,0,W,H)}else if(ph==='dusk'){X.fillStyle='rgba(255,120,60,.08)';X.fillRect(0,0,W,H)}
}

/* ---- 猫（所有姿势都按“面朝右”绘制，dir<0 时水平镜像） ---- */
const CP={o:"#f2a65a",d:"#c46a2b",k:"#222034",w:"#fff",p:"#ff8fa3"};
const CW=14;
const POSE={
 walk:["..........o.o.","..........oooo","...oooooooooko","..oddoddoooooop","..ooooooooooww.","..ooooooooooo.."],
 sit:[".......o..o...",".......oooo...",".......okok...",".......owpw...","......oooooo..",".....ooooooo..",".....oooooooo.",".....oowooow..",".....dd...dd.."],
 groom:["..............",".......o..o...",".......oooo...",".......odod.o.",".......owpwoo.","......oooooo..",".....oooooooo.",".....oowooow..",".....dd...dd.."],
 sleep:["..........o.o.","...ooooooooooo","..ooooooooddoo","..ooddoddoooow","..dddddddddddd"],
};
const cat={x:120,y:100,dir:-1,v:0,state:'sit',t:0,dur:200,target:120,phase:0,meow:0};
const FORCE=(new URLSearchParams(location.search)).get('cat'); // 调试：?cat=left / ?cat=right
function cpx(i,j,c){r(cat.dir>0?Math.round(cat.x)+i:Math.round(cat.x)+CW-1-i,cat.y+j,1,1,c)}
function rows(a,oy){a.forEach((row,j)=>[...row].forEach((ch,i)=>{if(CP[ch])cpx(i,j+oy,CP[ch])}))}
function pick(){
 const roll=Math.random();cat.t=0;
 if(roll<.55){cat.state='walk';let tx;do{tx=30+Math.random()*120}while(Math.abs(tx-cat.x)<20);cat.target=tx}
 else if(roll<.75){cat.state='groom';cat.dur=150+Math.random()*120}
 else if(roll<.88){cat.state='sleep';cat.dur=400+Math.random()*400}
 else{cat.state='sit';cat.dur=120+Math.random()*160;if(Math.random()<.6)cat.dir*=-1} // 偶尔转身张望
}
function updCat(f){
 cat.t++;
 if(FORCE){cat.state='walk';cat.dir=FORCE==='left'?-1:1;cat.target=cat.x+cat.dir*50}
 if(cat.state==='walk'){
  const dist=cat.target-cat.x, want=Math.sign(dist)*Math.min(.6,Math.abs(dist)*.04);
  cat.v+=(want-cat.v)*.06;                         // 起步/停下缓动
  cat.x+=cat.v; cat.phase+=Math.abs(cat.v)*.35;
  if(Math.abs(cat.v)>.02)cat.dir=Math.sign(cat.v); // 朝向 = 速度方向
  if(FORCE){if(cat.x<-16)cat.x=W;if(cat.x>W)cat.x=-16}
  else if(Math.abs(dist)<.5&&Math.abs(cat.v)<.05){cat.v=0;cat.state='sit';cat.t=0;cat.dur=120+Math.random()*150}
 }else if(cat.t>cat.dur&&!cat.meow)pick();
 const s=cat.state, blink=(f%170)<7;
 if(s==='walk'){
  const fr=Math.floor(cat.phase)%4, step=[1,0,-1,0][fr], bob=(fr%2)?-1:0, oy=4+bob;
  rows(POSE.walk,oy);
  // 尾巴摆动
  const sway=Math.round(Math.sin(f/8));cpx(1,oy+2,CP.o);cpx(0,oy+1+sway,CP.o);cpx(1,oy+1,CP.o);
  // 四条腿：对角线两两成对（后左+前右 / 后右+前左）
  [[3,step],[11,step],[5,-step],[9,-step]].forEach(([lx,o],i)=>{const c=i%2?CP.d:CP.o;cpx(lx,oy+6,c);cpx(lx+o,oy+7,c);if(oy+7<9)cpx(lx+o,9,c)});
  if(blink)cpx(12,oy+2,CP.o);
 }else if(s==='sleep'){
  rows(POSE.sleep,5);cpx(1,7,CP.o);cpx(0,8,CP.o);cpx(1,9,CP.d);
  if(((f>>5)%3)>0){X.fillStyle='#fff';X.font='6px monospace';X.textBaseline='top';const zx=Math.round(cat.x)+(cat.dir>0?10:0);X.fillText((f>>5)%3>1?'zZ':'z',zx,cat.y-4-((f>>3)%4))}
 }else{
  const P=s==='groom'?POSE.groom:POSE.sit;rows(P,1);
  if(s==='groom'){const lick=(f>>3)&1;cpx(11,lick?3:4,CP.p)}
  else if(blink)cpx(8,3,CP.o),cpx(10,3,CP.o);
  const sw=Math.round(Math.sin(f/20)*1.4);cpx(4,9,CP.o);cpx(3,9,CP.o);cpx(2,8,CP.o);cpx(2+(sw>0?0:0),7,CP.o);cpx(2+sw,6,CP.o);
 }
 if(cat.meow>0){cat.meow--;const bx=Math.round(cat.x)-4,by=cat.y-14;r(bx,by,22,10,'#222034');r(bx+1,by+1,20,8,'#fff');r(bx+5,by+10,2,2,'#222034');
   X.fillStyle='#222034';X.font='7px monospace';X.textBaseline='top';X.fillText('喵~',bx+3,by+1)}
}

let F=0;function loop(){X.clearRect(0,0,W,H);drawRoom(F);updCat(F);F++;requestAnimationFrame(loop)}

/* ---- 对话框 ---- */
let typing=null;
function say(title,text){clearInterval(typing);dlg.style.display='block';dlg.innerHTML='<b></b><br><span></span>';dlg.querySelector('b').textContent=title;const sp=dlg.querySelector('span');let i=0;typing=setInterval(()=>{sp.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typing)},28)}
dlg.onclick=e=>{e.stopPropagation();dlg.style.display='none'};

GALLERY.forEach((g,i)=>add(58+i*24,14,18,18,()=>say('🖼 '+g.title+' · '+g.year,g.desc)));
add(68,48,26,22,()=>say('💻 电脑','这是 Bao 的电脑。\nBao：哈尔滨工程大学毕业，在水下机器人公司做嵌入式工程师。\n平时写 C/C++，玩 STM32、RTOS、ArduSub 和 ROS；\n在学校时做过 AUV/ROV，也打过水下机器人比赛。'));
add(8,60,26,44,()=>say('📮 信箱','想给 Bao 写信？\n✉ Email：（待填写）\n🐙 GitHub：（待填写）\n旗子立起来了，说明……有新邮件？'));
add(156,34,30,56,()=>say('📚 书架','《STM32 从入门到冒烟》《RTOS 的一百种死锁》\n《ROS 与它的依赖地狱》《深海漫游指南》'));
add(8,12,40,34,()=>say('🪟 窗户',{day:'外面阳光正好，适合出海测试。',dusk:'黄昏了，ROV 该回收了。',night:'夜深了，星星出来了。猫还没睡。'}[phase()]));
add(112,56,14,38,()=>say('💡 台灯','啪嗒。灯光暖暖的。\n（灯会在傍晚和夜里自己亮起来）'));
add(60,68,46,26,()=>say('🪑 书桌','桌上有一杯咖啡，已经凉了。'));

C.addEventListener('click',e=>{const b=C.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;
 if(x>=cat.x-2&&x<=cat.x+15&&y>=cat.y-2&&y<=cat.y+11){cat.meow=90;cat.v=0;cat.state='sit';cat.t=0;cat.dur=150;say('🐱 Mochi','喵~ 喵喵！\n（它看起来想要小鱼干）');return}
 for(let i=items.length-1;i>=0;i--){const it=items[i];if(x>=it.x&&x<it.x+it.w&&y>=it.y&&y<it.y+it.h){it.fn();return}}
 dlg.style.display='none'});
loop();
</script>
</body>
</html>
